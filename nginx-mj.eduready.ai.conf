# Nginx Reverse Proxy Configuration for mj.eduready.ai (173.231.53.226)
# Place at: /etc/nginx/conf.d/mj.eduready.ai.conf

server {
    listen 80;
    server_name mj.eduready.ai;
    return 301 https://mj.eduready.ai$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mj.eduready.ai;

    ssl_certificate /root/.acme.sh/eduready.ai_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/eduready.ai_ecc/eduready.ai.key;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    # SSE Real-time Room Stream (Must disable proxy buffering!)
    location /api/room/events {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Room REST API & Static Assets served by server.mjs
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /data/www/mj.eduready.ai/logs/nginx.log;
    error_log /data/www/mj.eduready.ai/logs/nginx_err.log;
}
