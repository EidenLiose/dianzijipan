# Nginx Reverse Proxy Configuration for mj.eduready.ai (173.231.53.226)
# Place at: /etc/nginx/conf.d/mj.eduready.ai.conf or /etc/nginx/sites-enabled/mj.eduready.ai.conf
# After placing, run: certbot --nginx -d mj.eduready.ai  (to enable HTTPS for WebRTC Voice Chat!)

server {
    listen 80;
    server_name mj.eduready.ai 173.231.53.226;

    # Increase max body size for signaling packets
    client_max_body_size 10M;

    # SSE Real-time Room Stream (Must disable proxy buffering!)
    location /api/room/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Room REST API & Static Assets served by server.mjs
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
